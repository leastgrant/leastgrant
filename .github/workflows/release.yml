# Release: a version tag, verified end to end, then npm, then GitHub.
#
# The trigger is a tag and nothing else. Merging to `main` never publishes; a
# maintainer deciding to release is the act of pushing `vX.Y.Z`, and everything
# after that is mechanical.
#
# The filename matters. npm's trusted publisher for this package is bound to
# `release.yml` by name, so renaming this file silently breaks publishing until
# the configuration on npmjs.com is updated to match. See RELEASING.md.
#
# Four jobs, in order, each gated on the last:
#
#   guard    cheap, offline, refuses an inconsistent tag before anything else runs
#   verify   the same checks every pull request gets, on a clean checkout
#   publish  builds, verifies the artifact, publishes it via OIDC, proves it
#   release  creates the GitHub Release and attaches the verified tarball
#
# `publish` holds `id-token: write` and no write access to the repository;
# `release` holds `contents: write` and no OIDC. Neither can do the other's job.
name: Release

on:
  push:
    tags:
      # Globs, not regex: `+` quantifies the preceding character, so `[0-9]+`
      # is "one or more digits" and `v?.?.?` would not mean what it looks like.
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  # Recovery only: re-run the release for a tag that already exists, after
  # fixing whatever went wrong. Select the tag as the workflow ref. Every guard
  # below still applies, and a version already on npm is not published twice.
  workflow_dispatch:

# Nothing is granted by default. Each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  # Deliberately NOT cancel-in-progress. Cancelling a release mid-flight is how
  # you end up published on npm with no GitHub Release, or worse, cancelled
  # between the publish call and the check that it worked.
  cancel-in-progress: false

env:
  # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0.
  NODE_VERSION: '22'
  MIN_NPM: '11.5.1'
  PACKAGE_NAME: leastgrant

jobs:
  # ---------------------------------------------------------------------------
  guard:
    name: Guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.guard.outputs.version }}
      tag: ${{ steps.guard.outputs.tag }}
      npm_tag: ${{ steps.guard.outputs.npm_tag }}
      prerelease: ${{ steps.guard.outputs.prerelease }}
      sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Everything is built from this exact commit, named explicitly rather
          # than by tag, so that moving the tag mid-run cannot change what is
          # released.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: The tag and the package must agree
        id: guard
        env:
          # Via the environment, never interpolated into the script body.
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/release-guard.mjs

      - name: The tag must be on main
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          # `fetch-depth: 0` above already brings every branch, but the
          # remote-tracking ref is fetched explicitly if it is somehow absent
          # rather than letting the check below pass vacuously. The fetch is
          # unauthenticated (`persist-credentials: false`), which is fine for a
          # public repository and would need revisiting if this ever became one.
          if ! git rev-parse --verify -q origin/main >/dev/null; then
            git fetch --no-tags origin main:refs/remotes/origin/main
          fi
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$TAG points at $SHA, which is not an ancestor of origin/main."
            echo "::error::Releases are cut from main. Merge the commit first, then tag it."
            exit 1
          fi
          echo "$TAG -> $SHA, which is on main"

  # ---------------------------------------------------------------------------
  # The same verification an ordinary pull request gets: three operating
  # systems, three Node versions, the bypass corpus, the path fuzzer, and a
  # pack/install/smoke of the artifact on every platform.
  #
  # `use-cache: false` because a release must not consume a dependency cache
  # that some earlier, less trusted run populated.
  verify:
    name: Verify
    needs: guard
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.guard.outputs.sha }}
      use-cache: false

  # ---------------------------------------------------------------------------
  publish:
    name: Publish to npm
    needs: [guard, verify]
    runs-on: ubuntu-latest
    environment:
      # Not an approval gate — there are no required reviewers. It gives the
      # release a deployment record, lets the tag policy be enforced in one
      # place, and lets npm's trusted publisher be bound to this environment as
      # well as to this filename, so no other workflow in the repository can
      # publish even if it were named the same.
      name: npm-release
      url: https://www.npmjs.com/package/leastgrant/v/${{ needs.guard.outputs.version }}
    permissions:
      contents: read
      id-token: write # the OIDC token npm exchanges; grants nothing else
    outputs:
      integrity: ${{ steps.artifact.outputs.integrity }}
      sha256: ${{ steps.artifact.outputs.sha256 }}
      already_published: ${{ steps.exists.outputs.already_published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          # No dependency cache in a release build: a poisoned cache would be
          # restored into the one job that holds an OIDC token.

      - name: npm must be new enough for trusted publishing
        run: |
          have=$(npm --version)
          echo "npm $have, node $(node --version)"
          if [ "$(printf '%s\n%s\n' "$MIN_NPM" "$have" | sort -V | head -n1)" != "$MIN_NPM" ]; then
            echo "npm $have is older than $MIN_NPM; installing a newer npm"
            npm install -g "npm@>=$MIN_NPM"
            npm --version
          fi

      # `--ignore-scripts`: the only dependencies are TypeScript and its types,
      # neither of which needs a lifecycle script, and this is the job holding
      # the publishing credential.
      - run: npm ci --ignore-scripts

      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Randomised symlink topologies
        run: node scripts/fuzz-paths.mjs

      - name: Pack
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Inspect the artifact
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: node scripts/verify-tarball.mjs "$RUNNER_TEMP/$PACKAGE_NAME-$VERSION.tgz" --expect-version "$VERSION"

      - name: Install it into an empty directory and use it
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: node scripts/smoke-tarball.mjs "$RUNNER_TEMP/$PACKAGE_NAME-$VERSION.tgz" --expect-version "$VERSION"

      # The identity of the thing that was just verified. `npm pack` is byte
      # reproducible, so this integrity string is what the registry must report
      # afterwards — which is how "we published exactly what we verified" stops
      # being a claim and becomes a check.
      - name: Fingerprint the artifact
        id: artifact
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          TGZ="$RUNNER_TEMP/$PACKAGE_NAME-$VERSION.tgz"
          INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$TGZ" | openssl base64 -A)"
          SHA256=$(sha256sum "$TGZ" | cut -d' ' -f1)
          echo "integrity=$INTEGRITY" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "$SHA256  $PACKAGE_NAME-$VERSION.tgz" > "$TGZ.sha256"
          {
            echo "### Artifact"
            echo ''
            echo "| | |"
            echo "|---|---|"
            echo "| file | \`$PACKAGE_NAME-$VERSION.tgz\` |"
            echo "| sha256 | \`$SHA256\` |"
            echo "| integrity | \`$INTEGRITY\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Re-running a release must not try to publish a version that is already
      # there. npm would reject it, but the failure would be indistinguishable
      # from a real problem, and the GitHub Release step after it would never
      # run — which is precisely the half-released state to avoid.
      - name: Is this version already on the registry?
        id: exists
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set +e
          node scripts/verify-published.mjs "$PACKAGE_NAME" "$VERSION" --exists
          code=$?
          set -e
          case "$code" in
            0) echo 'already_published=true'  >> "$GITHUB_OUTPUT" ;;
            3) echo 'already_published=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::could not reach the registry to check whether $VERSION exists"; exit 1 ;;
          esac

      # No token anywhere. npm detects the OIDC environment, exchanges the
      # id-token for a short-lived credential, and — because this is a public
      # repository publishing a public package through a trusted publisher —
      # generates the provenance attestation automatically. `--provenance` is
      # deliberately absent: the docs say it is not needed, and passing it would
      # turn the automatic path into an explicit one that can fail differently.
      #
      # `--ignore-scripts` again, and this one is load-bearing: without it npm
      # runs `prepublishOnly`, which rebuilds `dist/` and would republish a tree
      # different from the one verified two steps ago.
      - name: Publish
        if: steps.exists.outputs.already_published == 'false'
        env:
          NPM_TAG: ${{ needs.guard.outputs.npm_tag }}
        run: |
          echo "publishing under dist-tag: $NPM_TAG"
          if ! npm publish --ignore-scripts --tag "$NPM_TAG"; then
            echo "::error::npm publish failed."
            echo "::error::If this is E404 or ENEEDAUTH, the trusted publisher on npmjs.com does not match this run."
            echo "::error::It must be: repository leastgrant/leastgrant, workflow file 'release.yml', environment 'npm-release', action 'npm publish'."
            exit 1
          fi

      - name: Nothing was published, and that is fine
        if: steps.exists.outputs.already_published == 'true'
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          echo "::notice::$PACKAGE_NAME@$VERSION is already on the registry; skipping publish."
          echo "The artifact built here is still checked against it below."

      # Whether we just published it or found it already there, the registry
      # must now hold the bytes this job verified, with provenance.
      - name: Prove the registry holds what was verified
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          INTEGRITY: ${{ steps.artifact.outputs.integrity }}
          ALREADY: ${{ steps.exists.outputs.already_published }}
        run: |
          # The integrity comparison is unconditional: whatever sits on the
          # registry under this version must be the bytes this job verified.
          #
          # Provenance is only *required* when this run did the publishing. A
          # version that was already there was published by something else — in
          # practice the single hand publish that has to happen before a trusted
          # publisher can be configured at all — and this workflow cannot give it
          # an attestation after the fact. It reports what it finds rather than
          # failing a release it did not cause.
          FLAGS=(--integrity "$INTEGRITY")
          if [ "$ALREADY" = 'true' ]; then
            FLAGS+=(--provenance-advisory)
          else
            FLAGS+=(--expect-provenance)
          fi
          node scripts/verify-published.mjs "$PACKAGE_NAME" "$VERSION" "${FLAGS[@]}"

      - name: Keep the artifact for the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-tarball
          path: |
            ${{ runner.temp }}/${{ env.PACKAGE_NAME }}-${{ needs.guard.outputs.version }}.tgz
            ${{ runner.temp }}/${{ env.PACKAGE_NAME }}-${{ needs.guard.outputs.version }}.tgz.sha256
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: [guard, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and attach the tarball; no OIDC here
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball
          path: ${{ runner.temp }}/dist

      # The artifact crossed a job boundary. Cheap to prove it is still the file
      # the publish job fingerprinted, so prove it.
      #
      # Located by glob rather than by exact name, with a count assertion: that
      # is correct whether or not the download step ever changes how it
      # materialises files, and an unexpected number of matches is itself worth
      # failing on.
      - name: The attached tarball is the published one
        env:
          WANT: ${{ needs.publish.outputs.sha256 }}
        run: |
          shopt -s nullglob
          FOUND=("$RUNNER_TEMP"/dist/*.tgz)
          if [ "${#FOUND[@]}" -ne 1 ]; then
            echo "::error::expected exactly one tarball in the artifact, found ${#FOUND[@]}"
            printf "  %s\n" "${FOUND[@]}"
            exit 1
          fi
          TGZ="${FOUND[0]}"
          GOT=$(sha256sum "$TGZ" | cut -d' ' -f1)
          echo "want $WANT"
          echo "got  $GOT"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::the artifact changed between jobs; refusing to attach it"
            exit 1
          fi
          echo "TGZ=$TGZ" >> "$GITHUB_ENV"

      # `gh` is preinstalled on GitHub-hosted runners, so no third-party action
      # is needed. Idempotent by construction: re-running after a partial
      # failure updates the existing release instead of failing on it.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
          VERSION: ${{ needs.guard.outputs.version }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
          SHA256: ${{ needs.publish.outputs.sha256 }}
          INTEGRITY: ${{ needs.publish.outputs.integrity }}
          ALREADY: ${{ needs.publish.outputs.already_published }}
        run: |
          NOTES="$RUNNER_TEMP/notes.md"
          {
            echo "\`\`\`"
            echo "npm install -g $PACKAGE_NAME@$VERSION"
            echo "\`\`\`"
            echo ''
            # Describe how this version actually reached the registry. If it was
            # already there when the run started, this workflow did not publish
            # it and cannot claim provenance for it — in practice that is the one
            # hand publish that has to happen before a trusted publisher can be
            # configured at all. Printing the usual sentence anyway would send
            # readers to `npm audit signatures` expecting an attestation that is
            # not there, and a failed check on a healthy package teaches people
            # to ignore the check.
            if [ "$ALREADY" = 'true' ]; then
              echo "Published to npm by hand, before a trusted publisher existed for this"
              echo "package, so this version carries no provenance attestation. Later"
              echo "releases are published by \`.github/workflows/release.yml\` and do."
            else
              echo "Published to npm from \`.github/workflows/release.yml\` with provenance."
            fi
            echo ''
            echo "Either way the bytes on the registry were checked, after the fact,"
            echo "against the ones this workflow built and tested:"
            echo ''
            echo "\`\`\`"
            echo "npm view $PACKAGE_NAME@$VERSION dist.integrity   # $INTEGRITY"
            if [ "$ALREADY" != 'true' ]; then
              echo "npm audit signatures"
            fi
            echo "\`\`\`"
            echo ''
            echo "\`$PACKAGE_NAME-$VERSION.tgz\` attached below is the exact artifact published."
            echo ''
            echo "    sha256  $SHA256"
          } > "$NOTES"

          # Append the auto-generated changelog here rather than passing
          # `--generate-notes` to `gh release create`.
          #
          # `create` can generate notes; `edit` cannot. Using the flag would mean
          # a first run produces a release with a changelog and a re-run — the
          # recovery path, after a partial failure — quietly replaces it with one
          # that has none. Idempotent has to mean the same release, not a
          # degraded one, so both paths build the identical body from the same
          # REST endpoint that backs the flag.
          if gh api --method POST \
               "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
               -f tag_name="$TAG" --jq '.body' > "$RUNNER_TEMP/generated.md" 2>/dev/null; then
            printf '\n\n' >> "$NOTES"
            cat "$RUNNER_TEMP/generated.md" >> "$NOTES"
          else
            # A missing changelog is not worth failing a release over; the parts
            # that carry the security claims are already written above.
            echo "::warning::could not generate the changelog; publishing notes without it"
          fi

          # `--verify-tag` stops gh inventing a tag if one is somehow missing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; updating it in place"
            gh release edit "$TAG" --notes-file "$NOTES" --prerelease="$PRERELEASE"
            gh release upload "$TAG" "$TGZ" "$TGZ.sha256" --clobber
          else
            gh release create "$TAG" "$TGZ" "$TGZ.sha256" \
              --title "$TAG" \
              --notes-file "$NOTES" \
              --verify-tag \
              --prerelease="$PRERELEASE"
          fi
          echo "::notice::https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
